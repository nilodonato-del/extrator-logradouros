<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Extrator de Logradouros</title>
<style>
  :root { --primary:#2c6ecb; --ok:#1b8a4b; --err:#c0392b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:#fafafa; color:#1a1a1a; }
  .container { max-width: 720px; margin: 40px auto; padding: 24px; }
  form { background:#fff; padding: 24px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  label { display:block; font-weight: 600; margin: 16px 0 6px 0; font-size: 14px; }
  label:first-of-type { margin-top: 0; }
  input[type=file], input[type=text] { width:100%; padding:10px; font-size:14px; border:1px solid #ccc; border-radius:6px; }
  .row { display:grid; grid-template-columns: 3fr 1fr; gap:12px; }
  .hint { font-size:12px; color:#888; margin-top:4px; }
  button { margin-top:24px; width:100%; padding:12px; font-size:15px; font-weight:600; color:#fff; background: var(--primary); border:0; border-radius:6px; cursor:pointer; }
  button:disabled { opacity:.55; cursor: not-allowed; }
  #status { margin-top: 20px; padding: 12px; border-radius:6px; font-size:14px; display:none; white-space: pre-wrap; word-break: break-word; }
  #status.info { display:block; background:#e8f0fb; color:var(--primary); }
  #status.success { display:block; background:#e2f5ea; color:var(--ok); }
  #status.error { display:block; background:#fbe6e3; color:var(--err); }
</style>
</head>
<body>
<div class="container">
  <h1>Extrator de Logradouros</h1>
  <p style="color:#666;font-size:14px">PDF (mapa de arruamento) + shapefile oficial + OSM (opcional) → GeoPackage georreferenciado</p>

  <form id="form">
    <label for="pdf">Mapa em PDF</label>
    <input type="file" id="pdf" accept=".pdf,application/pdf" required>

    <label for="shp">Shapefile oficial do município (.zip/.gpkg)</label>
    <input type="file" id="shp" accept=".zip,.shp,.gpkg,.geojson" required>

    <label for="osm">Dados do OpenStreetMap (opcional - .gpkg)</label>
    <input type="file" id="osm" accept=".gpkg,.geojson,.shp,.zip">
    <div class="hint">Envie o arquivo .gpkg gerado no Colab para cidades grandes (melhora a precisão).</div>

    <div class="row" style="margin-top:16px">
      <div>
        <label for="municipio" style="margin-top:0">Município</label>
        <input type="text" id="municipio" placeholder="Ex.: Campina Grande" required>
      </div>
      <div>
        <label for="uf" style="margin-top:0">UF</label>
        <input type="text" id="uf" maxlength="2" placeholder="PB" required>
      </div>
    </div>

    <button type="submit" id="btn">Processar</button>
  </form>
  <div id="status"></div>
</div>

<script>
  const form = document.getElementById("form");
  const btn = document.getElementById("btn");
  const statusEl = document.getElementById("status");

  function setStatus(kind, msg) { statusEl.className = kind; statusEl.textContent = msg; }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    btn.disabled = true;
    const t0 = Date.now();
    setStatus("info", "Enviando arquivos... 0s");
    const timer = setInterval(() => setStatus("info", "Processando... " + Math.floor((Date.now()-t0)/1000) + "s"), 500);
